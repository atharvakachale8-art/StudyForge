{% extends "base.html" %}

{% block title %}
System Authentication | StudyForge
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="system-label">
            SYSTEM
        </div>

        <h1 class="auth-title">
            AUTHENTICATION
        </h1>

        <p class="auth-subtitle">
            Welcome back. Your progress awaits.
        </p>

        <div class="system-line"></div>

        <form action="/login" method="POST">

            <div class="input-group">
                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="system-btn">
                INITIALIZE LOGIN
            </button>

        </form>

        <p class="auth-footer">
            New player?
            <a href="/register">Create an account</a>
        </p>

    </div>

</div>

{% endblock %}
