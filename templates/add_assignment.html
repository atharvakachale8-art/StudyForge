{% extends "base.html" %}

{% block title %}
Register New Quest | StudyForge
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card quest-form-card">

        <div class="system-label">
            SYSTEM
        </div>

        <h1 class="auth-title">
            REGISTER QUEST
        </h1>

        <p class="auth-subtitle">
            A new challenge has appeared.
        </p>

        <div class="system-line"></div>

        <form action="/add_assignment" method="POST">

            <div class="input-group">
                <label for="title">QUEST TITLE</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter quest title"
                    required
                >
            </div>

            <div class="input-group">
                <label for="subject">SUBJECT</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="e.g. Mathematics"
                    required
                >
            </div>

            <div class="input-group">
                <label for="description">DESCRIPTION</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the quest..."
                    rows="4"
                    required
                ></textarea>
            </div>

            <div class="input-group">
                <label for="due_date">DEADLINE</label>
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    required
                >
            </div>

            <div class="reward-preview">

                <span>QUEST REWARD</span>

                <div>
                    ⭐ +50 XP
                    &nbsp;&nbsp;&nbsp;
                    💰 +20 COINS
                </div>

            </div>

            <button type="submit" class="system-btn">
                REGISTER QUEST
            </button>

        </form>

        <p class="auth-footer">
            <a href="/dashboard">← Return to Quest Log</a>
        </p>

    </div>

</div>

{% endblock %}
