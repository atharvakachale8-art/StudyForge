{% extends "base.html" %}

{% block title %}
System Initialization | StudyForge
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="system-label">
            SYSTEM
        </div>

        <h1 class="auth-title">
            NEW PLAYER
        </h1>

        <p class="auth-subtitle">
            Initialize your StudyForge account.
        </p>

        <div class="system-line"></div>

        <form action="/register" method="POST">

            <div class="input-group">
                <label for="username">USERNAME</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose your username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">EMAIL</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create your password"
                    required
                >
            </div>

            <button type="submit" class="system-btn">
                INITIALIZE SYSTEM
            </button>

        </form>

        <p class="auth-footer">
            Already registered?
            <a href="/login">Return to Login</a>
        </p>

    </div>

</div>

{% endblock %}
